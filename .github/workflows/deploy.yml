# Builds the site and publishes it to GitHub Pages on every push to main (or by hand, from the
# Actions tab). Turn it on once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck, lint, formatting and tests must pass before anything is published
      - run: npm run check

      # Where the site lives: a repo named <user>.github.io is served from the root ('/'); any
      # other repo from '/<repo>/'. A custom domain also serves from the root: set the repository
      # variable BASE_PATH to '/' (Settings → Secrets and variables → Actions → Variables).
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ -n "${{ vars.BASE_PATH }}" ]; then BASE="${{ vars.BASE_PATH }}"
          elif [[ "$REPO" == *.github.io ]]; then BASE="/"
          else BASE="/$REPO/"; fi
          echo "Building for $BASE"
          BASE_PATH="$BASE" npm run build
          # GitHub Pages shows 404.html for any address it doesn't know: let the site handle it
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
